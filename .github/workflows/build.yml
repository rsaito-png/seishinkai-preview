name: build-site
on:
  push:
    branches: [main]
    paths: ['content/**', '_src/**']
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]
permissions:
  contents: write
concurrency: { group: build-site, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build HTML from content/*.md
        run: OUT=. CONTENT=content python3 _src/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || (git commit -m "site: rebuild from docs" && git push)
